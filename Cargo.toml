[package]
name = "physim"
version = "0.1.0"
edition = "2024"
description = "A physics simulation that runs in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MouseEvent",
    "Performance",
    "Window",
]
